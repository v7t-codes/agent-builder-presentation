<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="520"
  viewBox="0 0 1200 520"
  role="img"
  aria-label="A five-level autonomy ladder for agents, from user-operated (L1) to user-observed (L5), showing user involvement decreasing as agent autonomy increases."
>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fbfbfe" />
    </linearGradient>

    <linearGradient id="axisGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#c4b5fd" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fca5a5" stop-opacity="0.9" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1224" flood-opacity="0.10" />
    </filter>

    <style>
      .frame {
        fill: url(#bg);
      }

      .card {
        stroke: rgba(148, 163, 184, 0.55);
        stroke-width: 1;
        filter: url(#softShadow);
      }

      .kicker {
        fill: #0f172a;
        font: 900 34px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        letter-spacing: -0.02em;
      }

      .title {
        fill: #0f172a;
        font: 820 22px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        letter-spacing: -0.01em;
      }

      .desc {
        fill: rgba(15, 23, 42, 0.78);
        font: 560 14px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }

      .axis-label {
        fill: rgba(15, 23, 42, 0.82);
        font: 780 18px Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        letter-spacing: -0.01em;
      }

      .icon {
        fill: none;
        stroke: rgba(15, 23, 42, 0.72);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <rect class="frame" x="0" y="0" width="1200" height="520" rx="22" />

  <!-- Cards row -->
  <!-- Layout: 5 cards, 210w, 300h, 18 gap, 39 margin -->
  <!-- Card backgrounds -->
  <rect class="card" x="39" y="36" width="210" height="310" rx="18" fill="#f3f0ff" />
  <rect class="card" x="267" y="36" width="210" height="310" rx="18" fill="#eeeaff" />
  <rect class="card" x="495" y="36" width="210" height="310" rx="18" fill="#e7e0ff" />
  <rect class="card" x="723" y="36" width="210" height="310" rx="18" fill="#dfd5ff" />
  <rect class="card" x="951" y="36" width="210" height="310" rx="18" fill="#d5c8ff" />

  <!-- L1 -->
  <text class="kicker" x="63" y="86">L1</text>
  <!-- hand (simple) -->
  <path class="icon" d="M210 74 v42 c0 10 -8 18 -18 18 h-22 c-10 0 -18 -8 -18 -18 v-34" />
  <path class="icon" d="M152 96 v-18" />
  <path class="icon" d="M162 96 v-22" />
  <path class="icon" d="M172 96 v-24" />
  <path class="icon" d="M182 98 v-20" />

  <text class="title" x="63" y="136">User as an</text>
  <text class="title" x="63" y="164">Operator</text>
  <text class="desc" x="63" y="202">The user directs and makes</text>
  <text class="desc" x="63" y="224">decisions, and the agent acts.</text>

  <!-- L2 -->
  <text class="kicker" x="291" y="86">L2</text>
  <!-- loop arrows -->
  <path class="icon" d="M410 78 a26 26 0 1 0 20 44" />
  <path class="icon" d="M426 118 l10 8 l-12 4" />
  <path class="icon" d="M424 76 l-10 -8 l12 -4" />

  <text class="title" x="291" y="136">User as a</text>
  <text class="title" x="291" y="164">Collaborator</text>
  <text class="desc" x="291" y="202">The user and agent collaborate</text>
  <text class="desc" x="291" y="224">to plan, delegate, and execute.</text>

  <!-- L3 -->
  <text class="kicker" x="519" y="86">L3</text>
  <!-- speech bubble + question -->
  <path class="icon" d="M650 76 h34 a14 14 0 0 1 14 14 v14 a14 14 0 0 1 -14 14 h-16 l-12 10 v-10 h-6 a14 14 0 0 1 -14 -14 v-14 a14 14 0 0 1 14 -14 z" />
  <path class="icon" d="M670 95 c0 -6 10 -6 10 0 c0 5 -5 6 -5 10" />
  <path class="icon" d="M675 116 v2" />

  <text class="title" x="519" y="136">User as a</text>
  <text class="title" x="519" y="164">Consultant</text>
  <text class="desc" x="519" y="202">The agent leads, but consults</text>
  <text class="desc" x="519" y="224">the user for preferences.</text>

  <!-- L4 -->
  <text class="kicker" x="747" y="86">L4</text>
  <!-- check badge -->
  <path class="icon" d="M888 96 a22 22 0 1 1 -44 0 a22 22 0 0 1 44 0" />
  <path class="icon" d="M858 96 l8 8 l16 -18" />

  <text class="title" x="747" y="136">User as an</text>
  <text class="title" x="747" y="164">Approver</text>
  <text class="desc" x="747" y="202">The agent engages the user only</text>
  <text class="desc" x="747" y="224">for risky or predefined actions.</text>

  <!-- L5 -->
  <text class="kicker" x="975" y="86">L5</text>
  <!-- eye -->
  <path class="icon" d="M1090 96 c-14 -18 -32 -27 -54 -27 c-22 0 -40 9 -54 27 c14 18 32 27 54 27 c22 0 40 -9 54 -27 z" />
  <path class="icon" d="M1050 96 a14 14 0 1 1 -28 0 a14 14 0 0 1 28 0" />

  <text class="title" x="975" y="136">User as an</text>
  <text class="title" x="975" y="164">Observer</text>
  <text class="desc" x="975" y="202">The agent operates with high</text>
  <text class="desc" x="975" y="224">autonomy under user monitoring.</text>

  <!-- Axis bar -->
  <rect x="39" y="382" width="1122" height="92" rx="18" fill="url(#axisGrad)" opacity="0.95" />
  <text class="axis-label" x="63" y="440">User involvement</text>
  <text class="axis-label" x="1137" y="440" text-anchor="end">Agent autonomy</text>
</svg>

